name: Validate and deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JSON data
        shell: bash
        run: |
          set -euo pipefail
          for file in data/*.json; do
            python -m json.tool "$file" >/dev/null
          done

      - name: Check pages match data/prices.json
        run: python scripts/sync_prices.py --check

      - name: Validate JSON-LD blocks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, sys
          from pathlib import Path

          bad = []
          for page in [Path("index.html"), *sorted(Path("battles").glob("*.html"))]:
              blocks = re.findall(r'(?s)<script type="application/ld\+json">(.*?)</script>', page.read_text(encoding="utf-8"))
              for block in blocks:
                  try:
                      json.loads(block)
                  except json.JSONDecodeError as exc:
                      bad.append(f"{page}: {exc}")
          if bad:
              sys.exit("Invalid JSON-LD:\n" + "\n".join(bad))
          PY

      - name: Verify required site files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f privacy.html
          test -d assets
          test -d battles

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
